name: knowledge
on:
  push:
    paths: ["docs/knowledge/**", "README.md", "scripts/check-knowledge.mjs"]
  pull_request:
    paths: ["docs/knowledge/**", "README.md", "scripts/check-knowledge.mjs"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-knowledge.mjs
