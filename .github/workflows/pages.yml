# GitHub Pages（/<repo>/）へ公開する。リポジトリの Settings → Pages で Source を「GitHub Actions」にしておく。
# 公開のたびに版（semver のタグ v<major>.<minor>.<patch>）を一つ進める。上げ幅はマージした PR のラベルで決める：
#   semver:major → 次のメジャー、semver:minor → 次のマイナー、ラベルなし → パッチ。
# 同じコミットを公開し直すとき（再実行）は、付いているタグをそのまま使う。
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)
          if [ -n "$existing" ]; then
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          bump=patch
          if grep -qx 'semver:major' <<<"$labels"; then bump=major; elif grep -qx 'semver:minor' <<<"$labels"; then bump=minor; fi
          v=$(node scripts/next-version.mjs "$bump")
          echo "上げ幅: $bump → $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          APP_VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.new == 'true'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
